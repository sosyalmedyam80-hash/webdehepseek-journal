name: WebdeHepSeek Autonomous Agents Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 feedparser google-generativeai

      - name: Run Autonomous Scrapers & AI Writers
        env:
          GEMINI_API_KEY: "AQ.Ab8RN6JQoq2-qgSa9HJLLyhJsLXAGYbKysGfws3iB7P0Oe8Siw"
        run: |
          python agent_orchestrator.py

      - name: Commit and Push New Articles
        run: |
          git config --global user.name "WebdeHepSeek Bot"
          git config --global user.email "bot@webdehepseek.com"
          git add halk/news.json
          git commit -m "🤖 Otonom Ajanlar: Yeni haberler güncellendi" || echo "Değişiklik yok"
          git push
